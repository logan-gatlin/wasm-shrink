[workspace]
members = ["crates/wasm-shrink", "crates/cli", "crates/fuzz"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wasm-shrink = { path = "crates/wasm-shrink" }
# Unreleased on main after 0.28.0: no empty `else` arms (#336), visitors that
# see each field once (#337) and a configurable function order (#342).
walrus = { git = "https://github.com/wasm-bindgen/walrus", rev = "ed30b7ddb37a5e37576ff86e788d4d7a5302a9ac", features = ["parallel"] }
